# Minimal CI (GK 13 Nov 2026, Baton #2415): a merge needs a green pipeline on the
# exact head. Two jobs: the test suite, and the production image build, which
# also runs the Dockerfile's build-time import + "mcp < 2" guard. The build was
# the part nobody checked before (Assay #2410).
stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pytest:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -q ".[dev]"
    - python -m pytest -q

docker-build:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t dney-mcp:ci .
    # The image must start and answer /health with the new CMD.
    - docker run -d --name mcp -p 3001:3001 dney-mcp:ci
    - for i in $(seq 1 20); do docker exec mcp python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3001/health')" && break; sleep 1; done
    - docker exec mcp python -c "import urllib.request;assert urllib.request.urlopen('http://127.0.0.1:3001/health').status==200"
    - docker exec mcp sh -c "cat /proc/1/cmdline | tr '\0' ' '" | grep -- "--timeout-keep-alive 310"
